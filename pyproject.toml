[tool.poetry]
name = "nichebench"
version = "0.3.0"
description = "Benchmarking harness for evaluating LLM agents on structured tasks across CMS and code generation domains."
authors = ["Sergiu Nagailic (Nikro) <nikro.md@gmail.com>"]
readme = "README.md"
# `nichebench/*` (glob) keeps poetry-core from recursively expanding the whole
# package tree during discovery; the 438 MB frameworks/*/data submodules would
# otherwise be re-walked once per directory and stall `poetry build`.
packages = [{include = "nichebench/*", from = "src"}]
# Directory form (no `/**`) so the exclude walk enumerates each data tree once.
exclude = ["src/nichebench/frameworks/*/data"]

[tool.poetry.scripts]
nichebench = "nichebench.cli.app:main"

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
typer = "^0.27.3"
rich = "^15.0.0"
pyyaml = "^6.0.3"
python-dotenv = "^1.2.4"
litellm = "==1.106.7"
aiohttp = "^3.14.5"


[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-xdist = "^3.8.0"
black = "^26.10.1"
ruff = "^0.17.3"
pre-commit = "^4.7.0"
types-pyyaml = "^6.0.12.20261103"
mypy = "^2.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[tool.ruff]
line-length = 120
extend-exclude = ["src/nichebench/frameworks/*/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PIE", "FURB", "RET", "SIM", "ERA"]

[tool.ruff.lint.per-file-ignores]
# Allow long literal prompt strings in framework prompt modules
"src/nichebench/frameworks/*/prompts/*.py" = ["E501"]
"src/nichebench/frameworks/*/prompts/judges/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["src/nichebench/frameworks/.*/data/"]
