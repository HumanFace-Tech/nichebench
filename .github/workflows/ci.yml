name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.10.x, 3.11.x]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.6.1
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock', '**/pyproject.toml') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-ansi

    - name: Run unit tests
      run: poetry run pytest -q tests/unit

    - name: Run ruff check
      run: poetry run ruff check src tests

    - name: Run mypy
      run: poetry run mypy src

    - name: Verify release build and install
      if: matrix.python-version == '3.11.x'
      run: |
        poetry build --format wheel
        release_venv="$RUNNER_TEMP/nichebench-release-venv"
        python -m venv "$release_venv"
        "$release_venv/bin/python" -m pip install --no-cache-dir dist/*.whl
        "$release_venv/bin/nichebench" --help
